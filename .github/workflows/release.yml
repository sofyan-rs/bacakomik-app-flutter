name: Release

# Push a tag like v1.2.0 to build signed APKs and the desktop apps, and
# publish a GitHub release. The tag must match `version:` in pubspec.yaml
# (without the build number). Notes come from .github/release-notes/<tag>.md,
# else GitHub's generated notes.
#
# Run it by hand (workflow_dispatch) to build every platform without
# publishing; the files are kept as workflow artifacts.
#
# Asset names are what the in-app updater looks for (ReleaseAsset suffixes in
# lib/features/update/data/datasources/app_installer.dart).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir dist
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app-$abi-release.apk" "../../../../dist/BacaKomik-$VERSION-$abi.apk"
          done
          cp app-release.apk "../../../../dist/BacaKomik-$VERSION-universal.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          flutter pub get
          flutter build macos --release \
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"

      # The zip is what the updater installs; the dmg is for first installs.
      - name: Package
        run: |
          mkdir -p dist dmg
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent BacaKomik.app "$GITHUB_WORKSPACE/dist/BacaKomik-$VERSION-macos.zip"
          cp -R BacaKomik.app "$GITHUB_WORKSPACE/dmg/"
          ln -s /Applications "$GITHUB_WORKSPACE/dmg/Applications"
          hdiutil create -volname BacaKomik -srcfolder "$GITHUB_WORKSPACE/dmg" -ov -format UDZO \
            "$GITHUB_WORKSPACE/dist/BacaKomik-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          flutter pub get
          flutter build windows --release \
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"
          # Flutter apps need the VC++ runtime, which not every PC has.
          cp /c/Windows/System32/{msvcp140,vcruntime140,vcruntime140_1}.dll build/windows/x64/runner/Release/

      - name: Build installer
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          "$ISCC" "/DAppVersion=$VERSION" windows/packaging/installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # GTK and the toolchain for Flutter, GStreamer for audioplayers, WPE
      # WebKit, libsecret and Wayland for flutter_inappwebview.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev libwayland-dev libepoxy-dev
          # WPE package names differ between releases: the first WPE WebKit
          # found, and the backend packages that exist.
          apt-cache search --names-only wpe
          installed=
          for p in libwpewebkit-1.1-dev libwpewebkit-2.0-dev libwpewebkit-1.0-dev; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              sudo apt-get install -y "$p" && installed=$p && break
            fi
          done
          [ -n "$installed" ] || { echo "::error::No WPE WebKit dev package"; exit 1; }
          for p in libwpe-1.0-dev libwpebackend-fdo-1.0-dev; do
            if apt-cache show "$p" >/dev/null 2>&1; then sudo apt-get install -y "$p"; fi
          done

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          flutter pub get
          flutter build linux --release \
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"

      - name: Build AppImage
        run: |
          APPDIR=build/AppDir
          mkdir -p "$APPDIR/usr/bin" dist
          cp -r build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          cp linux/packaging/bacakomik.desktop linux/packaging/bacakomik.png "$APPDIR/"
          cat > "$APPDIR/AppRun" <<'SH'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/bacakomik" "$@"
          SH
          chmod +x "$APPDIR/AppRun"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" \
            "dist/BacaKomik-$VERSION-linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  publish:
    if: github.ref_type == 'tag'
    needs: [version, android, macos, windows, linux]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" notes.md
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -q .body > notes.md
          fi
          # The app hides everything from this heading on (AppRelease.apkTableHeading).
          cat >> notes.md <<MD

          ## Which APK?

          | File | For |
          |---|---|
          | \`BacaKomik-$VERSION-arm64-v8a.apk\` | Almost all phones from the last years |
          | \`BacaKomik-$VERSION-armeabi-v7a.apk\` | Older 32-bit phones |
          | \`BacaKomik-$VERSION-x86_64.apk\` | Emulators and Chromebooks |
          | \`BacaKomik-$VERSION-universal.apk\` | Any device, if you're unsure (bigger download) |

          Requires Android 7.0 or newer. Installed apps check for this update on start.

          ## Desktop

          | File | For |
          |---|---|
          | \`BacaKomik-$VERSION-windows-setup.exe\` | Windows 10 and 11 (64-bit) |
          | \`BacaKomik-$VERSION-macos.dmg\` | macOS 12 or newer, Intel and Apple silicon |
          | \`BacaKomik-$VERSION-linux-x86_64.AppImage\` | Linux (64-bit) |

          The desktop apps are not signed yet. On macOS, open the app the first time with
          right click → Open (or run \`xattr -cr /Applications/BacaKomik.app\`). On Windows,
          SmartScreen may ask: More info → Run anyway. On Linux, make the AppImage executable;
          the web view needs WPE WebKit (\`sudo apt install libwpewebkit-1.1-0 libwpebackend-fdo-1.0-1\`
          on Debian and Ubuntu).
          MD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
