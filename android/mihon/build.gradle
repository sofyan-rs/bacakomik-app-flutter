// Runs Mihon extension APKs inside the app (docs/ARCHITECTURE.md §8.9). The
// Mihon source API and SCANCORE's host are vendored here (licences in the
// files' headers and LICENSE-SCANCORE);
// extensions link against these classes by name. Library versions follow
// Mihon's (through SCANCORE's host), so extensions find what they were
// built against.
plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.serialization" version "2.4.21"
}

android {
    namespace "org.kurodev.bacakomik.mihon"
    compileSdk 37

    defaultConfig {
        minSdk 24
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The host needs Android 9 (signing info, DelegateLastClassLoader) and
    // refuses to start below it (MihonHost.supported).
    lint {
        disable "NewApi"
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    api 'org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.11.0'
    api 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.11.0'
    api 'com.squareup.okhttp3:okhttp:5.5.0'
    api 'com.squareup.okhttp3:okhttp-brotli:5.5.0'
    // Keiyoushi's extensions decompress Zstd themselves (Mihon ships it too).
    api 'com.squareup.okhttp3:okhttp-zstd:5.5.0'
    api 'com.squareup.okhttp3:okhttp-dnsoverhttps:5.5.0'
    api 'com.squareup.okio:okio:3.18.2'
    api 'org.jsoup:jsoup:1.23.2'
    api 'io.reactivex:rxjava:1.3.8'
    api 'uy.kohesive.injekt:injekt-core:1.16.1'
    api 'androidx.preference:preference-ktx:1.2.1'
    // zhanghai's fork of app.cash.quickjs (Apache-2.0), as Mihon uses.
    api 'com.github.zhanghai.quickjs-java:quickjs-android:547f5b1597'
    testImplementation 'junit:junit:4.13.2'
}
