org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# Pub cache (C:) and project (D:) are on different drives; Kotlin incremental caches fail on Windows.
kotlin.incremental=false
android.suppressUnsupportedCompileSdk=37
# cronet-api and cronet-shared (native_dio_adapter) share the org.chromium.net
# namespace, which AGP otherwise rejects.
android.uniquePackageNames=false
