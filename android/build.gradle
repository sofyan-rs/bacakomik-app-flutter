allprojects {
    repositories {
        google()
        mavenCentral()
        // Only QuickJS for Mihon extensions (the fork Mihon uses).
        maven {
            url "https://jitpack.io"
            content { includeGroup "com.github.zhanghai.quickjs-java" }
        }
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
// flutter_js pins Kotlin's jvmTarget to 1.8 but leaves Java on AGP's default
// (11), which Gradle rejects. Align Java with Kotlin for that plugin only.
subprojects {
    if (project.name == 'flutter_js') {
        project.plugins.withId('com.android.library') {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
