name: bacakomik_app
description: "Manga application project."
publish_to: "none"

version: 1.0.1+4

environment:
  sdk: ^3.13.0

dependencies:
  audioplayers: ^6.8.1
  auto_height_grid_view: ^1.0.0
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  custom_refresh_indicator: ^4.0.2
  device_info_plus: ^13.3.0
  dio: ^5.4.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.3.1
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.0.9
  gal: ^2.3.3
  google_fonts: ^9.0.0
  grouped_list: ^6.0.0
  hydrated_bloc: ^11.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.2
  permission_handler: ^13.0.2
  solar_icons: ^0.2.0
  url_launcher: ^6.2.4

dev_dependencies:
  build_runner: ^2.4.8
  change_app_package_name: ^1.1.0
  flutter_gen_runner: ^5.4.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_gen:
  output: lib/core/assets/
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
