name: bacakomik_app
description: "Manga application project."
publish_to: "none"

version: 1.2.1+8

environment:
  sdk: ^3.13.0

dependencies:
  app_links: ^7.2.2
  audioplayers: ^6.8.1
  background_downloader: ^9.6.4
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.3.2
  custom_refresh_indicator: ^4.0.2
  dio: ^5.4.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.3.1
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.0.9
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  gal: ^2.3.3
  get_it: ^9.3.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  injectable: ^3.0.0
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^4.0.0
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.2
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.1
  url_launcher: ^6.2.4
  wakelock_plus: ^1.8.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.8
  change_app_package_name: ^1.1.0
  flutter_gen_runner: ^5.4.0
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ">=4.0.0 <4.0.2"
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter_gen:
  output: lib/core/assets/
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Doto-Black.ttf
          weight: 900

# Native launch screen: black, matching the Flutter splash. Android 12+ shows
# the launcher icon on black. Regenerate with `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#000000"
  android_12:
    color: "#000000"
    icon_background_color: "#000000"
  ios: false
  web: false
